name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # 自动读取 frontend/package.json 中 packageManager 指定的 pnpm 版本
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        # --ignore-scripts 跳过 prepare（husky install）：
        # 前端已无独立 .git（仓库迁移到根目录），husky 找不到 frontend/.git 会报错；
        # CI 只需要装依赖 + lint + build，不需要 git hooks
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build
