<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="在线音乐播放器，支持歌单、歌词同步、搜索、收藏与播放历史的移动端 H5 音乐应用">
    <meta name="theme-color" content="#006d37">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <title>Music Player - 在线音乐播放器</title>
  </head>
  <body>
  <div id="app">
    <!-- 首屏骨架：仅整体框架，不显示细节，尺寸与真实页面一致 -->
    <div class="app-shell">
      <!-- 顶部栏占位 -->
      <div class="app-shell-header"></div>
  
      <div class="app-shell-title"></div>
      <!-- 推荐歌单占位：横向卡片 -->
      <div class="app-shell-section">
        <div class="app-shell-card"></div>
        <div class="app-shell-card"></div>
        <div class="app-shell-card"></div>
      </div>
      <div class="app-shell-title"></div>
      <!-- 热门歌曲占位：纵向列表 -->
      <div class="app-shell-section">
        <div class="app-shell-list-item"></div>
        <div class="app-shell-list-item"></div>
        <div class="app-shell-list-item"></div>
        <div class="app-shell-list-item"></div>
        <div class="app-shell-list-item"></div>
        <div class="app-shell-list-item"></div>
      </div>
    </div>
  </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
